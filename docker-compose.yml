version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trueface-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trueface_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trueface_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trueface-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trueface-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-trueface_db}
      - VECTOR_STORE_TYPE=faiss
      - FAISS_INDEX_PATH=/app/backend/app/search/indices/face_gallery.index
      - IDENTITY_MAPPING_PATH=/app/backend/app/search/indices/identity_mapping.json
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./backend/app/search/indices:/app/backend/app/search/indices
    networks:
      - trueface-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trueface-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - trueface-net

volumes:
  postgres_data:
    driver: local

networks:
  trueface-net:
    driver: bridge

